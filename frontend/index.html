<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>왕천재의 픽셀 오피스</title>
    <style>
        @font-face {
            font-family: 'ArkPixel';
            src: url('/static/fonts/ark-pixel-12px-proportional-zh_cn.ttf.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            font-family: 'ArkPixel', 'Courier New', monospace;
            padding: 20px 0;
            gap: 20px;
            overflow-x: hidden;
        }
        /* 底部面板容器 */
        #bottom-panels {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            width: 1280px;
            max-width: 95vw;
        }
        #game-container {
            border: 4px solid #e94560;
            image-rendering: pixelated;
            width: 1280px;
            height: 720px;
            max-width: 95vw;
            /* 手机上用“可见高度”限制，避免被底部面板挤压导致裁切 */
            max-height: 70vh;
            /* 关键：强制容器保持 16:9，避免 canvas 在不同布局下被拉伸变形 */
            aspect-ratio: 16 / 9;
        }
        #game-container canvas {
            width: 100% !important;
            height: 100% !important;
            image-rendering: pixelated;
            /* 再兜底一次：即使外层高度变化，也不要拉伸变形 */
            object-fit: contain;
        }
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000;
        }
        #loading-text {
            color: #ffd700;
            font-size: 18px;
            margin-bottom: 20px;
        }
        #loading-progress-container {
            width: 300px;
            height: 20px;
            background: #333;
            border: 2px solid #555;
            border-radius: 4px;
        }
        #loading-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ffd700);
            width: 0%;
            transition: width 0.3s ease;
        }
        #status-text {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #eee;
            font-size: 14px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 4px;
            max-width: 90%;
            text-align: center;
            font-family: 'ArkPixel', 'Courier New', monospace;
        }
        /* 状态控制栏 */
        #control-bar {
            background: #2c2f3a;
            padding: 10px 10px 12px;
            border-radius: 8px;
            border: 2px solid #e94560;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 380px;
            height: 300px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #control-bar-title {
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            padding: 6px 0 10px;
            border-bottom: 2px solid #4a4f5f;
        }
        #control-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            align-content: start;
            padding-top: 4px;
        }
        #control-buttons button { height: 52px; }
        #control-bar button {
            background: #3a3f4f;
            color: #fff;
            border: 2px solid #555;
            border-radius: 4px;
            padding: 8px 10px;
            cursor: pointer;
            font-family: 'ArkPixel', monospace;
            font-size: 12px;
            transition: all 0.2s;
        }
        #control-bar button:hover {
            background: #4a4f5f;
            border-color: #e94560;
        }
        /* Guest Agent 名单面板（右下角） */
        #guest-agent-panel {
            width: 360px;
            height: 300px;
            background: #2c2f3a;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #e94560;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        #guest-agent-panel-title {
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            padding-bottom: 8px;
            border-bottom: 2px solid #4a4f5f;
            margin-bottom: 6px;
        }
        #guest-agent-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        #guest-agent-list::-webkit-scrollbar { width: 6px; }
        #guest-agent-list::-webkit-scrollbar-track { background: #1a1a2e; }
        #guest-agent-list::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        .guest-agent-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            background: #3a3f4f;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #555;
        }
        .guest-agent-name {
            color: #fff;
            font-size: 14px;
            flex-shrink: 0;
        }
        .guest-agent-buttons {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }
        .guest-agent-buttons button {
            padding: 6px 10px;
            border-radius: 4px;
            border: 2px solid #555;
            background: #4a4f5f;
            color: #fff;
            font-family: 'ArkPixel', monospace;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .guest-agent-buttons button:hover {
            background: #5a5f6f;
            border-color: #e94560;
        }
        .guest-agent-buttons button.leave-btn {
            background: #5a1818;
            border-color: #e94560;
        }
        .guest-agent-buttons button.leave-btn:hover {
            background: #6a2828;
        }
        /* Memo 区域 - 4:3 小正方形 */
        #memo-panel {
            width: 400px;
            height: 300px;
            background-image: url('/static/memo-bg.png');
            background-size: cover;
            background-position: center;
            border: 3px solid #e94560;
            border-radius: 8px;
            padding: 14px 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        #memo-title {
            color: #ffd700;
            font-size: 14px;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: 1px;
            flex-shrink: 0;
        }
        #memo-date {
            color: #888;
            font-size: 10px;
            margin-bottom: 8px;
            text-align: right;
            flex-shrink: 0;
            position: relative;
            left: -30px; /* move date left by 30px */
        }
        #memo-content {
            color: #3b3b32;
            font-size: 12px;
            line-height: 1.8;
            white-space: pre-wrap;
            word-wrap: break-word;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
            position: relative;
            left: 80px; /* move content right by 80px */
        }
        #memo-content::-webkit-scrollbar {
            width: 6px;
        }
        #memo-content::-webkit-scrollbar-track {
            background: #1a1a2e;
        }
        #memo-content::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 3px;
        }
        #memo-placeholder {
            color: #666;
            font-style: italic;
            text-align: center;
            padding: 20px 0;
        }
        #history-panel {
            width: 360px;
            height: 300px;
            background: #2c2f3a;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #e94560;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
         #history-panel-title {
            color: #ffd700;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            letter-spacing: 1px;
            padding-bottom: 8px;
            border-bottom: 2px solid #4a4f5f;
            margin-bottom: 6px;
        }
        #history-list {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }
        #history-list::-webkit-scrollbar { width: 6px; }
        #history-list::-webkit-scrollbar-track { background: #1a1a2e; }
        #history-list::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        .history-item {
            background: #3a3f4f;
            border: 1px solid #555;
            border-radius: 6px;
            padding: 8px 10px;
            color: #fff;
            font-size: 12px;
            line-height: 1.4;
        }
        .history-meta {
            color: #ffd700;
            margin-bottom: 4px;
            font-size: 11px;
        }
        
        .history-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        #historyAgentFilter {
            background: #3a3f4f;
            color: #fff;
            border: 1px solid #555;
            border-radius: 4px;
            padding: 4px 6px;
            font-family: 'ArkPixel', monospace;
            font-size: 11px;
            max-width: 140px;
        }
        .ping-badge {
            margin-top: 3px;
            font-size: 11px;
            color: #9ae6b4;
        }

        .memo-decoration {
            text-align: center;
            margin: 4px 0;
            color: #555;
            font-size: 10px;
            flex-shrink: 0;
        }

        /* 手机端专属适配（不影响桌面） */
        @media (max-width: 900px), (pointer: coarse) {
            html, body {
                height: 100%;
            }

            body {
                padding: 0;
                gap: 0;
                overflow-x: hidden;
                overflow-y: auto;
                align-items: stretch;
            }

            #game-container {
                width: 100vw;
                height: 66.666vh; /* 办公室占 2/3 屏幕高度 */
                max-width: 100vw;
                max-height: 66.666vh;
                border-width: 0;
                border-radius: 0;
                aspect-ratio: auto;
                flex: 0 0 auto;
                touch-action: pan-y; /* 保留页面纵向滚动手势 */
                overflow: hidden;
            }

            #bottom-panels {
                width: 100vw;
                max-width: 100vw;
                min-height: 33.334vh; /* 余下约 1/3 可见区 */
                padding: 10px 10px 16px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                flex: 0 0 auto;
            }

            #memo-panel,
            #control-bar,
            #guest-agent-panel,
            #history-panel {
                width: 100%;
                height: auto;
                min-height: 180px;
            }

            #memo-panel { min-height: 220px; }
            #control-bar { min-height: 210px; }
            #guest-agent-panel { min-height: 220px; }
            #history-panel { min-height: 220px; }

            #memo-date {
                left: 0;
                text-align: left;
                margin-bottom: 6px;
            }
            #memo-content {
                left: 0;
                font-size: 13px;
                line-height: 1.7;
            }

            #control-bar-title,
            #guest-agent-panel-title,
            #history-panel-title,
            #memo-title {
                font-size: 14px;
            }

            #control-buttons button,
            #control-bar button,
            .guest-agent-buttons button {
                font-size: 12px;
                min-height: 44px;
            }

            .guest-agent-item {
                align-items: flex-start;
                gap: 10px;
                flex-direction: column;
            }
            .guest-agent-buttons {
                width: 100%;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }

            #status-text {
                bottom: 8px;
                font-size: 12px;
                padding: 8px 12px;
            }

            #coords-toggle,
            #pan-toggle {
                font-size: 12px !important;
                padding: 6px 8px !important;
            }
        }
    </style>
</head>
<body>
    <!-- 加载遮罩 -->
    <div id="loading-overlay">
        <div id="loading-text">왕천재의 픽셀 오피스 로딩중...</div>
        <div id="loading-progress-container">
            <div id="loading-progress-bar"></div>
        </div>
    </div>
    
    <div id="game-container"></div>
    
    <!-- 底部面板容器 -->
    <div id="bottom-panels">
        <!-- Memo 面板 -->
        <div id="memo-panel">
            <div id="memo-title">— 어 제 한 일 —</div>
            <div id="memo-date"></div>
            <div class="memo-decoration">─ ─ ─ ─ ─</div>
            <div id="memo-content">
                <div id="memo-placeholder">로딩중...</div>
            </div>
            <div class="memo-decoration">─ ─ ─ ─ ─</div>
        </div>
        
        <!-- 状态控制栏 -->
        <div id="control-bar">
            <div id="control-bar-title">왕천재 상태</div>
            <div id="control-buttons">
                <button onclick="setState('idle','대기중')">대기중</button>
                <button onclick="setState('writing','작업중')">작업중</button>
                <button onclick="setState('syncing','동기화중')">동기화중</button>
                <button onclick="setState('error','에러')">에러</button>
            </div>
        </div>

        <!-- Guest Agent 名单面板（右下角） -->
        <div id="guest-agent-panel">
            <div id="guest-agent-panel-title">— 에이전트 목록 —</div>
            <div id="guest-agent-list">
                <div style="color:#9ca3af;font-size:12px;text-align:center;padding:20px 0;">에이전트 불러오는 중...</div>
            </div>
        </div>
        <!-- History 面板 -->
        <div id="history-panel">
            <div style="margin-bottom:10px; padding:8px; border:1px solid #4a4f5f; border-radius:6px; background:#232733;">
                <div style="color:#ffd700;font-size:13px;margin-bottom:6px;">🎯 오늘의 미션</div>
                <div id="missions-list" style="display:flex;flex-direction:column;gap:6px;color:#cbd5e1;font-size:11px;">
                    <div>미션 로딩중...</div>
                </div>
            </div>
            <div class="history-header-row"><div id="history-panel-title">— 작업 히스토리 —</div><select id="historyAgentFilter"><option value="">전체</option><option value="왕천재">왕천재</option><option value="울트라맨">울트라맨</option><option value="똘똘이">똘똘이</option><option value="김양이">김양이</option><option value="토르">토르</option><option value="카다스">카다스</option></select></div>
            <div id="history-list">
                <div style="color:#9ca3af;font-size:12px;text-align:center;padding:20px 0;">히스토리 불러오는 중...</div>
            </div>
        </div>
    </div>
    
    <div id="status-text">로딩중...</div>
    <div id="coords-overlay" style="display:none; position:fixed; pointer-events:none; background:rgba(0,0,0,0.85); color:#fff; font-family:ArkPixel,monospace; font-size:14px; padding:8px 12px; border-radius:4px; z-index:99999;">
        <div id="coords-display">X: 0 | Y: 0</div>
    </div>
    <button id="coords-toggle" style="position:fixed; top:calc(env(safe-area-inset-top, 0px) + 12px); right:12px; z-index:999999; padding:8px 10px; font-family:ArkPixel,monospace; font-size:13px; cursor:pointer; border:2px solid #333; border-radius:5px; background:#333; color:#fff;">
        显示坐标
    </button>
    <button id="pan-toggle" style="position:fixed; top:calc(env(safe-area-inset-top, 0px) + 12px); left:12px; z-index:999999; padding:8px 10px; font-family:ArkPixel,monospace; font-size:13px; cursor:pointer; border:2px solid #333; border-radius:5px; background:#333; color:#fff;">
        移动视野
    </button>

    <button id="shop-open-btn" style="position:fixed;bottom:18px;right:18px;z-index:99999;padding:10px 12px;border:2px solid #e94560;border-radius:8px;background:#2c2f3a;color:#fff;font-family:ArkPixel,monospace;cursor:pointer;">🛒 상점</button>
    <div id="shop-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.72);z-index:100000;align-items:center;justify-content:center;">
      <div style="width:min(520px,92vw);max-height:80vh;overflow:auto;background:#1f2430;border:2px solid #e94560;border-radius:10px;padding:14px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:#ffd700;"><strong>오피스 상점</strong><button id="shop-close-btn" style="background:#333;color:#fff;border:1px solid #555;border-radius:4px;padding:4px 8px;cursor:pointer;">닫기</button></div>
        <div id="shop-list" style="display:flex;flex-direction:column;gap:8px;color:#fff;font-size:12px;"></div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        // 检测浏览器是否支持 WebP
        let supportsWebP = false;
        
        // 方法 1: 使用 canvas 检测
        function checkWebPSupport() {
            return new Promise((resolve) => {
                const canvas = document.createElement('canvas');
                if (canvas.getContext && canvas.getContext('2d')) {
                    resolve(canvas.toDataURL('image/webp').indexOf('data:image/webp') === 0);
                } else {
                    resolve(false);
                }
            });
        }
        
        // 方法 2: 使用 image 检测（备用）
        function checkWebPSupportFallback() {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = 'data:image/webp;base64,UklGRkoAAABXRUJQVlA4WAoAAAAQAAAAAAAAAAAAQUxQSAwAAAABBxAR/Q9ERP8DAABWUDggGAAAADABAJ0BKgEAAQADADQlpAADcAD++/1QAA==';
            });
        }
        
        // 获取文件扩展名（根据 WebP 支持情况）
        function getExt(pngFile) {
            // star-working-spritesheet.png 太宽了，WebP 不支持，始终用 PNG
            if (pngFile === 'star-working-spritesheet.png') {
                return '.png';
            }
            return supportsWebP ? '.webp' : '.png';
        }

        const IS_TOUCH_DEVICE = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia('(pointer: coarse)').matches;

        const config = {
            type: Phaser.AUTO,
            width: 1280,
            height: 720,
            parent: 'game-container',
            pixelArt: true,
            // 桌面端保持 FIT；手机端改 RESIZE，让办公室区域真正吃满分配到的高度。
            scale: {
                mode: IS_TOUCH_DEVICE ? Phaser.Scale.RESIZE : Phaser.Scale.FIT,
                autoCenter: Phaser.Scale.CENTER_BOTH,
                width: 1280,
                height: 720
            },
            physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
            scene: { preload: preload, create: create, update: update }
        };

        let totalAssets = 0;
        let loadedAssets = 0;
        let loadingProgressBar, loadingProgressContainer, loadingOverlay, loadingText;

        // Memo 相关函数
        async function loadMemo() {
            const memoDate = document.getElementById('memo-date');
            const memoContent = document.getElementById('memo-content');
            
            try {
                const response = await fetch('/yesterday-memo?t=' + Date.now(), { cache: 'no-store' });
                const data = await response.json();
                
                if (data.success && data.memo) {
                    memoDate.textContent = data.date || '';
                    memoContent.innerHTML = data.memo.replace(/\n/g, '<br>');
                } else {
                    memoContent.innerHTML = '<div id="memo-placeholder">어제 기록이 없습니다</div>';
                }
            } catch (e) {
                console.error('memo 불러오기 실패:', e);
                memoContent.innerHTML = '<div id="memo-placeholder">불러오기 실패</div>';
            }
        }

        // 更新加载进度
        function updateLoadingProgress() {
            loadedAssets++;
            const percent = Math.min(100, Math.round((loadedAssets / totalAssets) * 100));
            if (loadingProgressBar) {
                loadingProgressBar.style.width = percent + '%';
            }
            if (loadingText) {
                loadingText.textContent = `왕천재의 픽셀 오피스 로딩중... ${percent}%`;
            }
        }

        // 隐藏加载界面
        function hideLoadingOverlay() {
            setTimeout(() => {
                if (loadingOverlay) {
                    loadingOverlay.style.transition = 'opacity 0.5s ease';
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 500);
                }
            }, 300);
        }

        // 兜底：某些移动网络/CDN 抖动时，避免一直卡在“加载中”遮罩
        setTimeout(() => {
            if (loadingOverlay && loadingOverlay.style.display !== 'none') {
                hideLoadingOverlay();
            }
        }, 8000);
        
        // 懒加载逻辑已取消（体验优先：装饰首屏直接出现）

        function formatHistoryTime(ts) {
            if (!ts) return '--:--:--';
            const d = new Date(ts);
            if (Number.isNaN(d.getTime())) return ts;
            return d.toLocaleTimeString('ko-KR', { hour12: false });
        }

        function escapeHtml(s) {
            return String(s || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderHistory(items) {
            if (!historyListEl) historyListEl = document.getElementById('history-list');
            if (!historyListEl) return;

        function stopIdleWalk(agentId) {

                try { t.remove(false); } catch (e) {}

            }

        function startIdleWalk(agentId) {
            const g = guestSprites[agentId];
            if (!g || !g.basePos) return;
            stopIdleWalk(agentId);
            const tick = () => {
                const current = guestSprites[agentId];
                if (!current || current.state !== 'idle' || !current.basePos) return;
                const dx = (Math.random() - 0.5) * 40;
                const dy = (Math.random() - 0.5) * 20;
                const tx = current.basePos.x + dx;
                const ty = current.basePos.y + dy;
                if (guestTweens[agentId]?.move) guestTweens[agentId].move.stop();
                if (guestTweens[agentId]?.name) guestTweens[agentId].name.stop();
                if (guestTweens[agentId]?.mark) guestTweens[agentId].mark.stop();

                const yOffset = current.yOffset || 0;
                const nameOffsetY = current.nameOffsetY || 120;
                const moveTween = game.tweens.add({ targets: current.sprite, x: tx, y: ty + yOffset, duration: 2000, ease: 'Sine.easeInOut' });
                const nameTween = game.tweens.add({ targets: current.nameText, x: tx, y: (ty + yOffset) - nameOffsetY, duration: 2000, ease: 'Sine.easeInOut' });
                let markTween = null;
                if (current.errorMark) {
                    markTween = game.tweens.add({ targets: current.errorMark, x: tx + 26, y: (ty + yOffset) - (nameOffsetY + 6), duration: 2000, ease: 'Sine.easeInOut' });
                }
                guestTweens[agentId] = { move: moveTween, name: nameTween, mark: markTween };
            };
            tick();
            const delay = 3000 + Math.floor(Math.random() * 2000);
            guestIdleWalkTimers[agentId] = game.time.addEvent({ delay, loop: true, callback: tick });
        }

                const p = isDemo ? randomPointInRect(getAreaRect(state === 'error' ? 'error' : (state === 'idle' ? 'breakroom' : 'writing'))) : getGuestTargetPosition(agent, idx);

                if (!guestSprites[id]) {
                    let sprite;
                    const isDemoNika = DEMO_MODE && (agent.agentId === 'demo_ttolttoli' || agent.name === '똘똘이');
                    const isDemoMercury = DEMO_MODE && (agent.agentId === 'demo_kimyangi' || agent.name === '김양이');

                    if (isDemoNika && game.textures.exists('demo_kimyangi')) {
                        sprite = game.add.image(p.x, p.y, 'demo_kimyangi').setOrigin(0.5, 1).setScale(1.10);
                    } else if (isDemoMercury && game.textures.exists('demo_ttolttoli')) {
                        sprite = game.add.image(p.x, p.y, 'demo_ttolttoli').setOrigin(0.5, 1).setScale(1.10);
                    } else if ((agent.name === '똘똘이') && game.textures.exists('guestagent1')) {
                        sprite = game.add.image(p.x, p.y, 'guestagent1').setOrigin(0.5, 1).setScale(1.15);
                    } else if ((agent.name === '김양이') && game.textures.exists('guestagent2')) {
                        sprite = game.add.image(p.x, p.y, 'guestagent2').setOrigin(0.5, 1).setScale(1.05);
                    } else {
                        let animIdx = agent.avatar
                            ? parseInt((agent.avatar.match(/_(\d+)$/) || [])[1] || '0', 10)
                            : 0;
                        if (!animIdx || animIdx < 1 || animIdx > 6) {
                            const aid = String(agent.agentId || '');
                            let hash = 0;
                            for (let i = 0; i < aid.length; i++) hash = (hash * 31 + aid.charCodeAt(i)) >>> 0;
                            animIdx = (hash % 6) + 1;
                        }
                        const animKey = `guest_anim_${animIdx}`;
                        const animIdleKey = `guest_anim_${animIdx}_idle`;

                        if (game.textures.exists(animKey) && game.anims.exists(animIdleKey)) {
                            sprite = game.add.sprite(p.x, p.y, animKey).setOrigin(0.5, 1).setScale(4.0);
                            sprite.anims.play(animIdleKey, true);
                        } else {
                            const staticAvatarKey = agent.avatar && game.textures.exists(agent.avatar)
                                ? agent.avatar
                                : (() => {
                                    const aid = String(agent.agentId || '');
                                    let hash = 0;
                                    for (let i = 0; i < aid.length; i++) hash = (hash * 31 + aid.charCodeAt(i)) >>> 0;
                                    return GUEST_AVATARS[hash % GUEST_AVATARS.length];
                                })();

                            if (staticAvatarKey && game.textures.exists(staticAvatarKey)) {
                                sprite = game.add.image(p.x, p.y, staticAvatarKey).setOrigin(0.5, 1).setScale(1.15);
                            } else {
                                sprite = game.add.text(p.x, p.y, '⭐', { fontFamily: 'ArkPixel, monospace', fontSize: '30px' }).setOrigin(0.5, 1);
                            }
                        }
                    }

                    sprite.setDepth(2600);
                    if (DEMO_MODE && (agent.agentId === 'demo_kimyangi' || agent.name === '김양이')) {
                        sprite.y = sprite.y + 10;
                    }

                    const yOffset = (DEMO_MODE && (agent.agentId === 'demo_kimyangi' || agent.name === '김양이')) ? 10 : 0;
                    const nameOffsetY = isDemo ? 80 : 120;
                    const nameText = game.add.text(p.x, (p.y + yOffset) - nameOffsetY, agent.name || '에이전트', {
                        fontFamily: 'ArkPixel, monospace',
                        fontSize: isDemo ? '16px' : '15px',
                        fill: '#ffffff',
                        stroke: '#000',
                        strokeThickness: 3
                    }).setOrigin(0.5);
                    nameText.setDepth(2601);

                    const errorMark = game.add.text(p.x + 26, (p.y + yOffset) - (nameOffsetY + 6), '❌', {
                        fontFamily: 'ArkPixel, monospace',
                        fontSize: '16px',
                        fill: '#ff4d4f',
                        stroke: '#000',
                        strokeThickness: 2
                    }).setOrigin(0.5);
                    errorMark.setDepth(2602);
                    errorMark.setVisible(state === 'error');

                    const levelBadge = game.add.text(p.x, (p.y + yOffset) - (nameOffsetY + 24), `Lv.${Number(agent.level || 1)}`, {
                        fontFamily: 'ArkPixel, monospace',
                        fontSize: '12px',
                        fill: '#ffd700',
                        stroke: '#000',
                        strokeThickness: 3
                    }).setOrigin(0.5);
                    levelBadge.setDepth(2603);

                    const fireBadge = game.add.text(p.x + 28, (p.y + yOffset) - (nameOffsetY + 28), '🔥', {
                        fontFamily: 'ArkPixel, monospace',
                        fontSize: '14px'
                    }).setOrigin(0.5);
                    fireBadge.setDepth(2604);
                    fireBadge.setVisible(Number(agent.combo || 0) >= 5);

                    guestSprites[id] = { sprite, nameText, levelBadge, fireBadge, errorMark, basePos: getAgentBasePosition(agent, idx), state, yOffset, nameOffsetY };
                }

                const g = guestSprites[id];
                g.basePos = getAgentBasePosition(agent, idx);
                g.state = state;

                if (guestTweens[id]?.move) guestTweens[id].move.stop();
                if (guestTweens[id]?.name) guestTweens[id].name.stop();
                if (guestTweens[id]?.mark) guestTweens[id].mark.stop();
                if (guestTweens[id]?.level) guestTweens[id].level.stop();
                if (guestTweens[id]?.fire) guestTweens[id].fire.stop();

                const duration = 850;
                const ease = 'Sine.easeInOut';
                const yOffset = g.yOffset || 0;
                const nameOffsetY = g.nameOffsetY || 120;
                const moveTween = game.tweens.add({ targets: g.sprite, x: p.x, y: p.y + yOffset, duration, ease });
                const nameTween = game.tweens.add({ targets: g.nameText, x: p.x, y: (p.y + yOffset) - nameOffsetY, duration, ease });
                let markTween = null;
                let levelTween = null;
                let fireTween = null;
                if (g.errorMark) {
                    g.errorMark.setVisible(state === 'error');
                    markTween = game.tweens.add({ targets: g.errorMark, x: p.x + 26, y: (p.y + yOffset) - (nameOffsetY + 6), duration, ease });
                }
                if (g.levelBadge) {
                    g.levelBadge.setText(`Lv.${Number(agent.level || 1)}`);
                    levelTween = game.tweens.add({ targets: g.levelBadge, x: p.x, y: (p.y + yOffset) - (nameOffsetY + 24), duration, ease });
                }
                if (g.fireBadge) {
                    g.fireBadge.setVisible(Number(agent.combo || 0) >= 5);
                    fireTween = game.tweens.add({ targets: g.fireBadge, x: p.x + 28, y: (p.y + yOffset) - (nameOffsetY + 28), duration, ease });
                }
                guestTweens[id] = { move: moveTween, name: nameTween, mark: markTween, level: levelTween, fire: fireTween };

                g.nameText.setText(agent.name || '에이전트');

                if (!isDemo && state === 'idle') {
                    startIdleWalk(id);
                } else {
                    stopIdleWalk(id);
                }
            });

            updateGuestDetailBubbles();

            Object.keys(guestSprites).forEach(id => {
                if (!seenIds.has(id)) {
                    stopIdleWalk(id);
                    guestSprites[id].sprite.destroy();
                    guestSprites[id].nameText.destroy();
                    if (guestSprites[id].errorMark) guestSprites[id].errorMark.destroy();
                    if (guestSprites[id].levelBadge) guestSprites[id].levelBadge.destroy();
                    if (guestSprites[id].fireBadge) guestSprites[id].fireBadge.destroy();
                    delete guestSprites[id];
                    if (guestBubbles[id]) {
                        guestBubbles[id].destroy();
                        delete guestBubbles[id];
                    }
                    if (guestTweens[id]) {
                        try { guestTweens[id].move && guestTweens[id].move.stop(); } catch(e) {}
                        try { guestTweens[id].name && guestTweens[id].name.stop(); } catch(e) {}
                        try { guestTweens[id].mark && guestTweens[id].mark.stop(); } catch(e) {}
                        try { guestTweens[id].level && guestTweens[id].level.stop(); } catch(e) {}
                        try { guestTweens[id].fire && guestTweens[id].fire.stop(); } catch(e) {}
                        delete guestTweens[id];
                    }
                }
            });
        }

        function maybeShowGuestBubble(time) {
            if (time - lastGuestBubbleAt < 5200) return;
            lastGuestBubbleAt = time;
            const ids = Object.keys(guestSprites);
            if (ids.length === 0) return;
            const id = ids[Math.floor(Math.random() * ids.length)];
            const g = guestSprites[id];

            // demo 气泡：优先展示与状态对应的内容，便于验证“状态→区域→气泡”链路
            const demoVisitor = (DEMO_MODE && window.__demoVisitors)
                ? (window.__demoVisitors.find(v => v.agentId === id) || window.__demoVisitors.find(v => v.name === (g.nameText && g.nameText.text)))
                : null;

            const statusThoughtsMap = {
                idle: ['휴게 구역에서 대기중', '잠시 쉬는 중', '충전중입니다'],
                writing: ['작업 구역에서 처리중', '문서 정리 및 실행중', '집중해서 진행중'],
                researching: ['정보 수집중', '자료 확인중', '조사 후 결과 공유 예정'],
                executing: ['실행중, 프로세스 동작중', '작업 구역에서 진행중', '계획을 실행으로 전환중'],
                syncing: ['동기화중, 곧 상태 업데이트', '진행 상황 동기화중', '데이터 동기화중 잠시만요'],
                error: ['에러 구역에서 점검중', '이상 감지, 복구중', '에러 대응중, 원인부터 파악']
            };
            const agentState = (guestAgents.find(a => a.agentId === id) || {}).state || 'idle';
            const thoughts = statusThoughtsMap[agentState] || statusThoughtsMap.idle;
            const text = (demoVisitor && demoVisitor.bubbleText) ? demoVisitor.bubbleText : thoughts[Math.floor(Math.random() * thoughts.length)];

            if (guestBubbles[id] && guestBubbles[id].__detailBubble) return;
            if (guestBubbles[id]) {
                guestBubbles[id].destroy();
                delete guestBubbles[id];
            }

            const bx = g.sprite.x;
            // 气泡位置：demo 维持原逻辑；真实访客放在“名字上方”，避免压角色也避免压名字
            const isDemoGuest = (demoVisitor && demoVisitor.isDemo) || (id === 'demo_ttolttoli' || id === 'demo_kimyangi');
            const nameH = (g.nameText && g.nameText.height) ? g.nameText.height : 16;
            const by = isDemoGuest ? (g.sprite.y - 90) : ((g.nameText ? g.nameText.y : (g.sprite.y - 150)) - (nameH / 2) - 22);
            const fontSize = IS_TOUCH_DEVICE ? 14 : 12;
            const bg = game.add.rectangle(bx, by, text.length * 10 + 24, 28, 0xffffff, 0.95);
            bg.setStrokeStyle(2, 0x000000);
            const txt = game.add.text(bx, by, text, { fontFamily: 'ArkPixel, monospace', fontSize: fontSize + 'px', fill: '#000' }).setOrigin(0.5);
            const bubble = game.add.container(0, 0, [bg, txt]);
            bubble.setDepth(2700);
            guestBubbles[id] = bubble;

            // 让气泡跟随 sprite 锚点（用于 demo 平滑移动时也保持贴合）
            bubble.__followAgentId = id;

            setTimeout(() => {
                if (guestBubbles[id]) {
                    guestBubbles[id].destroy();
                    delete guestBubbles[id];
                }
            }, 3200);

        function maybeRandomizeDemoVisitors() {
            if (!DEMO_MODE) return;
            ensureDemoVisitors();

            // 按海辛需求：每 8 秒切换一次状态
            window.__demoNextAt = window.__demoNextAt || 0;
            const now = Date.now();
            if (now < window.__demoNextAt) return;
            window.__demoNextAt = now + 8000;

            const states = ['idle', 'writing', 'researching', 'executing', 'syncing', 'error'];
            const bubbleTextMap = {
                idle: '휴게 구역에서 대기할게요',
                writing: '작업중입니다',
                researching: '조사중입니다',
                executing: '작업 실행중입니다',
                syncing: '상태 동기화중입니다',
                error: '문제 발생! 에러 구역으로 이동합니다'
            };

            // 确保两位 demo 角色不会总是同一个状态（增加可观测性）
            const pickJs = (exclude) => {
                let s = states[Math.floor(Math.random() * states.length)];
                let tries = 0;
                while (exclude && s === exclude && tries < 5) {
                    s = states[Math.floor(Math.random() * states.length)];
                    tries++;
                }
                return s;
            };

            const current = window.__demoVisitors || [];
            const cur0 = current[0] ? (current[0].state || 'idle') : 'idle';

            const next0 = pickJs(cur0);
            const next1 = pickJs(next0); // 尽量不同
            const nextStates = [next0, next1];

            const prevVisitors = current.map((v) => ({ ...v }));
            window.__demoVisitors = current.map((v, i) => {
                const nextState = nextStates[i] || pickJs(v.state);
                return {
                    ...v,
                    state: nextState,
                    bubbleText: bubbleTextMap[nextState] || String(nextState),
                    updated_at: new Date().toISOString()
                };
            });

            // 状态切换时：每一位 demo 都立即冒泡（强制），用于清晰验证链路
            try {
                if (typeof game !== 'undefined' && game) {
                    // 找出状态实际变了的 demo visitor，给他们强制冒泡
                    const prevById = {};
                    prevVisitors.forEach(v => { prevById[v.agentId] = v; });
                    const newVisitors = window.__demoVisitors || [];
                    newVisitors.forEach(agent => {
                        const prev = prevById[agent.agentId];
                        const changed = !prev || prev.state !== agent.state;
                        if (changed) {
                            // 直接冒泡
                            if (guestSprites[agent.agentId]) {
                                const g = guestSprites[agent.agentId];
                                const text = agent.bubbleText || '';
                                if (guestBubbles[agent.agentId]) {
                                    guestBubbles[agent.agentId].destroy();
                                    delete guestBubbles[agent.agentId];
                                }
                                const bx = g.sprite.x;
                                const by = g.sprite.y - 90;
                                const fontSize = IS_TOUCH_DEVICE ? 14 : 12;
                                const bg = game.add.rectangle(bx, by, text.length * 10 + 24, 28, 0xffffff, 0.95);
                                bg.setStrokeStyle(2, 0x000000);
                                const txt = game.add.text(bx, by, text, { fontFamily: 'ArkPixel, monospace', fontSize: fontSize + 'px', fill: '#000' }).setOrigin(0.5);
                                const bubble = game.add.container(0, 0, [bg, txt]);
                                bubble.setDepth(2700);
                                bubble.__followAgentId = agent.agentId;
                                guestBubbles[agent.agentId] = bubble;
                                setTimeout(() => {
                                    if (guestBubbles[agent.agentId]) {
                                        guestBubbles[agent.agentId].destroy();
                                        delete guestBubbles[agent.agentId];
                                    }
                                }, 3200);
                            }
                        }
                    });
                }
            } catch (e) { console.error('강제 버블 표시 실패:', e); }
        }

        function fetchPingAgents() {
            return fetch('/ping-agents?t=' + Date.now(), { cache: 'no-store' })
                .then(r => r.json())
                .then(data => {
                    pingResults = data || {};
                    renderGuestAgentList();
                })
                .catch(() => {});
        }

        function updateGuestDetailBubbles() {
            const activeStates = new Set(['executing', 'writing', 'syncing']);
            (guestAgents || []).forEach(agent => {
                const id = agent.agentId;
                const g = guestSprites[id];
                if (!g) return;
                const state = normalizeState(agent.state || 'idle');
                const detail = (agent.detail || '').trim();
                const shouldShow = activeStates.has(state) && detail;

                if (!shouldShow) {
                    if (guestBubbles[id] && guestBubbles[id].__detailBubble) {
                        guestBubbles[id].destroy();
                        delete guestBubbles[id];
                    }
                    guestDetailCache[id] = { state, detail: '' };
                    return;
                }

                const prev = guestDetailCache[id] || {};
                if (prev.state === state && prev.detail === detail && guestBubbles[id] && guestBubbles[id].__detailBubble) {
                    return;
                }

                if (guestBubbles[id]) {
                    guestBubbles[id].destroy();
                    delete guestBubbles[id];
                }

                const bx = g.sprite.x;
                const by = (g.nameText ? g.nameText.y : (g.sprite.y - 140)) - 24;
                const text = detail.length > 24 ? detail.slice(0, 24) + '…' : detail;
                const w = Math.max(90, text.length * 9 + 18);
                const bg = game.add.rectangle(bx, by, w, 26, 0xffffff, 0.95);
                bg.setStrokeStyle(2, 0x000000);
                const txt = game.add.text(bx, by, text, { fontFamily: 'ArkPixel, monospace', fontSize: (IS_TOUCH_DEVICE ? 13 : 11) + 'px', fill: '#000' }).setOrigin(0.5);
                const bubble = game.add.container(0, 0, [bg, txt]);
                bubble.setDepth(2750);
                bubble.__followAgentId = id;
                bubble.__detailBubble = true;
                guestBubbles[id] = bubble;
                guestDetailCache[id] = { state, detail };
            });
        }

        function fetchGuestAgents() {
            // demo 随机状态先更新（不依赖后端）
            maybeRandomizeDemoVisitors();

            return fetch('/agents?t=' + Date.now(), { cache: 'no-store' })
                .then(response => response.json())
                .then(data => {
                    // 无论后端返回是否为数组，demo=1 都应保证本地 demo 访客可见
                    guestAgents = Array.isArray(data) ? data : [];

                    // 新访客检测：触发 Star 欢迎气泡（只欢迎真实访客，不欢迎 demo）
                    try {
                        const merged = getMergedVisitors();
                        const currentIds = new Set((merged || []).filter(a => !a.isMain && !a.isDemo).map(a => a.agentId));

                        if (!guestWelcomeInitialized) {
                            // 首次初始化不欢迎，避免刷新页面就刷屏
                            lastSeenGuestIds = currentIds;
                            guestWelcomeInitialized = true;
                        } else {
                            const newIds = [];
                            currentIds.forEach(id => { if (!lastSeenGuestIds.has(id)) newIds.push(id); });

                            if (newIds.length > 0) {
                                // 只欢迎第一个新来的（避免同一时刻多人加入刷屏）
                                const newAgent = (merged || []).find(a => a.agentId === newIds[0]);
                                if (newAgent && newAgent.name) {
                                    // 临时将 currentState 视为 writing 以允许 showBubble 展示
                                    const oldState = currentState;
                                    currentState = 'writing';
                                    // 临时更换 bubble 文案
                                    const oldTexts = BUBBLE_TEXTS.writing;
                                    BUBBLE_TEXTS.writing = [
                                        `欢迎 ${newAgent.name} 来到办公室～`,
                                        `Hi ${newAgent.name}，一起开工吧`,
                                        `${newAgent.name} 已加入，欢迎！`
                                    ];
                                    showBubble();
                                    // 还原
                                    BUBBLE_TEXTS.writing = oldTexts;
                                    currentState = oldState;
                                }
                            }

                            lastSeenGuestIds = currentIds;
                        }
                    } catch (e) { /* ignore */ }

                    renderGuestAgentList();
                    renderGuestAgentsInScene();
                    updateGuestDetailBubbles();
                })
                .catch(error => {
                    console.error('에이전트 목록 조회 실패:', error);
                    // 即使拉取失败，demo 也要能渲染
                    if (DEMO_MODE) {
                        renderGuestAgentList();
                        renderGuestAgentsInScene();
                    }
                });
        }

        // 初始化：先检测 WebP 支持，再启动游戏

        }

            // 允许手机端“拖动/滑动”来移动视野（本质：移动 Phaser Camera）

            const panToggle = document.getElementById('pan-toggle');
            const isTouchDevice = IS_TOUCH_DEVICE;
            let panEnabled = false;
            let isPanning = false;
            let panStart = null; // {x,y,sx,sy}
            const camera = game.cameras.main;

            const MAP_W = config.width;
            const MAP_H = config.height;
            function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }
            function maxScrollX() {
                const viewportW = camera.width / Math.max(0.01, camera.zoom);
                return Math.max(0, MAP_W - viewportW);
            }
            function maxScrollY() {
                const viewportH = camera.height / Math.max(0.01, camera.zoom);
                return Math.max(0, MAP_H - viewportH);
            }
            function clampCameraScroll() {
                camera.scrollX = clamp(camera.scrollX, 0, maxScrollX());
                camera.scrollY = clamp(camera.scrollY, 0, maxScrollY());
            }

            // 手机上：锁定“办公室画布高度 = 2/3 区域高度”，
            // 让世界坐标在竖向恰好看满（不需要上下拖），只保留横向拖动浏览左右。
            // 记录初始是否已手动平移（避免 resize 时把用户拖好的位置重置）
            let hasManuallyPanned = false;
            function applyMobileCameraFit() {
                if (!isTouchDevice) return;
                const h = Math.max(1, camera.height);
                const w = Math.max(1, camera.width);

                // 关键：先按高度 fit，再看是否需要按宽度微调，
                // 保证既不会让画面歪，又能左右拖到最左最右边缘不被裁。
                const fitHeightZoom = h / MAP_H;
                const candidateZoom = fitHeightZoom;

                // 按 candidateZoom 计算：viewport 在世界坐标里的宽高
                const viewW = w / candidateZoom;
                const maxX = Math.max(0, MAP_W - viewW);

                camera.setZoom(candidateZoom);
                camera.scrollX = Math.min(camera.scrollX, maxX);
                camera.scrollY = 0;

                // 仅在未手动平移过时才居中（避免把用户拖好的位置冲掉）
                if (!hasManuallyPanned) {
                    camera.centerOn(MAP_W / 2, MAP_H / 2);
                }
                camera.scrollX = clamp(camera.scrollX, 0, maxX);
                camera.scrollY = 0;
            }
            applyMobileCameraFit();

            // 手机端旋转屏幕/地址栏伸缩时，重算 zoom + 夹紧 camera
            if (isTouchDevice && game.scale) {
                game.scale.on('resize', () => {
                    applyMobileCameraFit();
                });
            }

            camera.setBounds(0, 0, MAP_W, MAP_H);
            clampCameraScroll();

            function setPanEnabled(on) {
                panEnabled = on;
                if (panToggle) {
                    panToggle.textContent = on ? '시야 고정' : '시야 이동';
                    panToggle.style.background = on ? '#e94560' : '#333';
                }
                game.input.setDefaultCursor(on ? 'grab' : 'default');
            }

            if (panToggle) {
                panToggle.addEventListener('click', () => setPanEnabled(!panEnabled));
            }

            // 触屏设备默认开启拖动视野，避免必须先点按钮
            if (isTouchDevice) {
                setPanEnabled(true);
            }

            // iOS/Safari 手势策略：
            // - 保留垂直滚动（让页面能下滑看三个面板）
            // - 水平方向拖动时才阻止默认行为，并转为 camera 横向平移
            // 说明：iOS 对 pointer + touch-action 支持存在机型差异，所以这里加一套原生 touch 兜底。
            const canvasEl = game.canvas;
            let touchPan = null; // {x,y,sx,sy,lock:'x'|'y'|null}
            if (canvasEl) {
                canvasEl.style.touchAction = 'pan-y';

                canvasEl.addEventListener('touchstart', (e) => {
                    if (!panEnabled || e.touches.length !== 1) return;
                    const t = e.touches[0];
                    touchPan = { x: t.clientX, y: t.clientY, sx: camera.scrollX, sy: camera.scrollY, lock: null };
                }, { passive: true });

                canvasEl.addEventListener('touchmove', (e) => {
                    if (!panEnabled || !touchPan || e.touches.length !== 1) return;
                    const t = e.touches[0];
                    const dx = t.clientX - touchPan.x;
                    const dy = t.clientY - touchPan.y;

                    if (!touchPan.lock) {
                        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;
                        touchPan.lock = Math.abs(dx) >= Math.abs(dy) ? 'x' : 'y';
                    }

                    if (touchPan.lock === 'x') {
                        // 横向拖动交给办公室视野；阻止浏览器默认滚动
                        e.preventDefault();
                        hasManuallyPanned = true;
                        camera.scrollX = clamp(touchPan.sx - dx, 0, maxScrollX());
                    }
                    // lock==='y' 时不阻止默认，交给页面纵向滚动
                }, { passive: false });

                const clearTouchPan = () => { touchPan = null; };
                canvasEl.addEventListener('touchend', clearTouchPan, { passive: true });
                canvasEl.addEventListener('touchcancel', clearTouchPan, { passive: true });
            }

            game.input.on('pointerdown', (pointer) => {
                if (!panEnabled) return;
                isPanning = true;
                panStart = { x: pointer.x, y: pointer.y, sx: camera.scrollX, sy: camera.scrollY };
                game.input.setDefaultCursor('grabbing');
            });

            game.input.on('pointerup', () => {
                if (!panEnabled) return;
                isPanning = false;
                panStart = null;
                game.input.setDefaultCursor('grab');
            });

            game.input.on('pointermove', (pointer) => {
                if (!panEnabled || !isPanning || !panStart) return;
                const dx = pointer.x - panStart.x;
                const dy = pointer.y - panStart.y;

                // 手机端优先“横向拖动看办公室”，纵向手势留给页面滚动看下方面板。
                if (isTouchDevice && Math.abs(dy) > Math.abs(dx)) {
                    return;
                }

                // 手指向右拖，视野跟着向右看：camera scroll 向左减小（反向）
                const newX = panStart.sx - dx;
                hasManuallyPanned = true;
                camera.scrollX = clamp(newX, 0, maxScrollX());

                // 桌面端保留自由二维拖动
                if (!isTouchDevice) {
                    const newY = panStart.sy - dy;
                    camera.scrollY = clamp(newY, 0, maxScrollY());
                }
            });

            // Mouse move handler for coordinate display
            game.input.on('pointermove', (pointer) => {

        }

        function update(time) {
            if (time - lastGuestAgentsFetch > GUEST_AGENTS_FETCH_INTERVAL) { fetchGuestAgents(); lastGuestAgentsFetch = time; }
            if (time - lastMissionsFetch > 30000) { fetchMissions(); lastMissionsFetch = time; }
            if (time - lastLeaderboardFetch > 30000) { fetchLeaderboard(); lastLeaderboardFetch = time; }
            if (time - lastShopFetch > 30000) { fetchShop(); lastShopFetch = time; }

            // 兜底：非 idle 时确保机房动画在播，idle 时静止
            const effectiveStateForServer = pendingDesiredState || currentState;
            if (serverroom) {
                if (effectiveStateForServer === 'idle') {
                    if (serverroom.anims.isPlaying) {
                        serverroom.anims.stop();
                        serverroom.setFrame(0);
                    }
                } else {
                    if (!serverroom.anims.isPlaying || serverroom.anims.currentAnim?.key !== 'serverroom_on') {
                        serverroom.anims.play('serverroom_on', true);
                    }
                }
            }

            // error 状态：显示 bug 动画，并在两点之间来回移动
            if (window.errorBug) {
                if (effectiveStateForServer === 'error') {
                    window.errorBug.setVisible(true);
                    if (!window.errorBug.anims.isPlaying || window.errorBug.anims.currentAnim?.key !== 'error_bug') {
                        window.errorBug.anims.play('error_bug', true);
                    }
                    // ping-pong move between x=1007 and x=1111 at y=221
                    const leftX = 1007;
                    const rightX = 1111;
                    const speed = 0.6; // -50% speed
                    const dir = window.errorBugDir || 1;
                    window.errorBug.x += speed * dir;
                    window.errorBug.y = 221;
                    if (window.errorBug.x >= rightX) {
                        window.errorBug.x = rightX;
                        window.errorBugDir = -1;
                    } else if (window.errorBug.x <= leftX) {
                        window.errorBug.x = leftX;
                        window.errorBugDir = 1;
                    }
                } else {
                    window.errorBug.setVisible(false);
                    window.errorBug.anims.stop();
                }
            }

            // Sync animation fallback logic
            if (syncAnimSprite) {
                if (effectiveStateForServer === 'syncing') {
                    if (!syncAnimSprite.anims.isPlaying || syncAnimSprite.anims.currentAnim?.key !== 'sync_anim') {
                        syncAnimSprite.anims.play('sync_anim', true);
                    }
                } else {
                    if (syncAnimSprite.anims.isPlaying) syncAnimSprite.anims.stop();
                    syncAnimSprite.setFrame(0);
                }
            }

            // 冒气泡
            if (time - lastBubble > BUBBLE_INTERVAL) {
                showBubble();
                lastBubble = time;
            }
            // 猫的气泡（频率低）
            if (time - lastCatBubble > CAT_BUBBLE_INTERVAL) {
                showCatBubble();
                lastCatBubble = time;
            }

            // 打字机效果
            if (typewriterIndex < typewriterTarget.length && time - lastTypewriter > TYPEWRITER_DELAY) {
                typewriterText += typewriterTarget[typewriterIndex];
                statusText.textContent = typewriterText;
                typewriterIndex++;
                lastTypewriter = time;
            }

            // 移动 + 小踱步
            moveStar(time);

            // guest 随机想法泡泡
            maybeShowGuestBubble(time);

            // demo 平滑移动时：让气泡每帧跟随角色锚点（避免 tween 时气泡滞留在旧位置）
            try {
                Object.keys(guestBubbles).forEach(id => {
                    const b = guestBubbles[id];
                    const g = guestSprites[id];
                    if (!b || !g) return;
                    if (b.__followAgentId !== id) return;
                    b.x = 0;
                    b.y = 0;
                    // children[0]=bg, children[1]=text
                    const bx = g.sprite.x;
                    const isDemoGuest = (id === 'demo_ttolttoli' || id === 'demo_kimyangi');
                    const nameH = (g.nameText && g.nameText.height) ? g.nameText.height : 16;
                    const by = isDemoGuest ? (g.sprite.y - 90) : ((g.nameText ? g.nameText.y : (g.sprite.y - 150)) - (nameH / 2) - 22);
                    if (b.list && b.list[0]) { b.list[0].x = bx; b.list[0].y = by; }
                    if (b.list && b.list[1]) { b.list[1].x = bx; b.list[1].y = by; }
                });
            } catch (e) {}

            // guest 列表会定时刷新
        }

        function normalizeState(s) {
            if (!s) return 'idle';
            if (s === 'working') return 'writing';
            if (s === 'run' || s === 'running') return 'executing';
            if (s === 'sync') return 'syncing';
            if (s === 'research') return 'researching';
            return s;
        }

        function applyStateData(data) {
            const nextState = normalizeState(data?.state);
            const stateInfo = STATES[nextState] || STATES.idle;
            const changed = (pendingDesiredState === null) && (nextState !== currentState);
            const nextLine = '[' + stateInfo.name + '] ' + ((data && data.detail) || '...');
            if (changed) {
                typewriterTarget = nextLine;
                typewriterText = '';
                typewriterIndex = 0;

                pendingDesiredState = null;
                currentState = nextState;

                if (nextState === 'idle') {
                    if (game.textures.exists('sofa_busy')) {
                        sofa.setTexture('sofa_busy');
                        sofa.anims.play('sofa_busy', true);
                    }
                    star.setVisible(false);
                    star.anims.stop();
                    if (window.starWorking) {
                        window.starWorking.setVisible(false);
                        window.starWorking.anims.stop();
                    }
                } else if (nextState === 'error' || nextState === 'syncing') {
                    sofa.anims.stop();
                    sofa.setTexture('sofa_idle');
                    star.setVisible(false);
                    star.anims.stop();
                    if (window.starWorking) {
                        window.starWorking.setVisible(false);
                        window.starWorking.anims.stop();
                    }
                } else {
                    sofa.anims.stop();
                    sofa.setTexture('sofa_idle');
                    star.setVisible(false);
                    star.anims.stop();
                    if (window.starWorking) {
                        window.starWorking.setVisible(true);
                        window.starWorking.anims.play('star_working', true);
                    }
                }

                if (serverroom) {
                    if (nextState === 'idle') {
                        serverroom.anims.stop();
                        serverroom.setFrame(0);
                    } else {
                        serverroom.anims.play('serverroom_on', true);
                    }
                }

                if (syncAnimSprite) {
                    if (nextState === 'syncing') {
                        if (!syncAnimSprite.anims.isPlaying || syncAnimSprite.anims.currentAnim?.key !== 'sync_anim') {
                            syncAnimSprite.anims.play('sync_anim', true);
                        }
                    } else {
                        syncAnimSprite.anims.stop();
                        syncAnimSprite.setFrame(0);
                    }
                }
            } else {
                if (!typewriterTarget || typewriterTarget !== nextLine) {
                    typewriterTarget = nextLine;
                    typewriterText = '';
                    typewriterIndex = 0;
                }
            }
        }

        function fetchStatus() {
            fetch('/status')
                .then(response => response.json())
                .then(data => applyStateData(data))
                .catch(() => {
                    typewriterTarget = '연결 실패, 재시도 중...';
                    typewriterText = '';
                    typewriterIndex = 0;
                });
        }

        function initOfficeSocket() {
            if (typeof io === 'undefined') return;
            officeSocket = io();
            officeSocket.on('state_update', (payload) => {
                if (payload && payload.main) {
                    applyStateData(payload.main);
                }
                if (payload && Array.isArray(payload.agents)) {
                    guestAgents = payload.agents.filter(a => !a.isMain);
                    renderGuestAgentList();
                    renderGuestAgentsInScene();
                }
                fetchHistory();
            });
            officeSocket.on('connect_error', () => {
                fetchStatus();
                fetchGuestAgents();
            });
        }

        function moveStar(time) {

            // Use pending state if available (for target area during transition)
            const effectiveState = pendingDesiredState || currentState;
            const stateInfo = STATES[effectiveState] || STATES.idle;
            const baseTarget = areas[stateInfo.area] || areas.breakroom;

            const dx = targetX - star.x;
            const dy = targetY - star.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const speed = 1.4;
            const wobble = Math.sin(time / 200) * 0.8;

            if (dist > 3) {
                // Move toward current target
                star.x += (dx / dist) * speed;
                star.y += (dy / dist) * speed;
                star.setY(star.y + wobble);
                isMoving = true;
            } else {
                // Arrived at a waypoint or final target
                if (waypoints && waypoints.length > 0) {
                    // Remove the first waypoint (we just arrived there)
                    waypoints.shift();
                    if (waypoints.length > 0) {
                        // Next waypoint exists
                        targetX = waypoints[0].x;
                        targetY = waypoints[0].y;
                        isMoving = true;
                    } else {
                        // Final target: apply pending state and switch visual
                        if (pendingDesiredState !== null) {
                            isMoving = false;
                            currentState = pendingDesiredState;
                            pendingDesiredState = null;

                            if (currentState === 'idle') {
                                // Sitting on sofa: hide Star only when arrived
                                star.setVisible(false);
                                star.anims.stop();
                                if (window.starWorking) {
                                    window.starWorking.setVisible(false);
                                    window.starWorking.anims.stop();
                                }
                            } else {
                                // Arrived at desk area: switch to star_working animation
                                star.setVisible(false);
                                star.anims.stop();
                                if (window.starWorking) {
                                    window.starWorking.setVisible(true);
                                    window.starWorking.anims.play('star_working', true);
                                }
                            }
                        }
                    }
                } else {
                    if (pendingDesiredState !== null) {
                        isMoving = false;
                        currentState = pendingDesiredState;
                        pendingDesiredState = null;

                        if (currentState === 'idle') {
                            star.setVisible(false);
                            star.anims.stop();
                            if (window.starWorking) {
                                window.starWorking.setVisible(false);
                                window.starWorking.anims.stop();
                            }
                            if (game.textures.exists('sofa_busy')) {
                                sofa.setTexture('sofa_busy');
                                sofa.anims.play('sofa_busy', true);
                            }
                        } else {
                            // Arrived at desk area: switch to star_working animation
                            star.setVisible(false);
                            star.anims.stop();
                            if (window.starWorking) {
                                window.starWorking.setVisible(true);
                                window.starWorking.anims.play('star_working', true);
                            }
                            sofa.anims.stop();
                            sofa.setTexture('sofa_idle');
                        }
                    }
                }
            }

            // Small wander only after arrival (non-idle)
            // Temporarily disabled to stay in work area; uncomment later if needed
            /*
            if (!isMoving && currentState !== 'idle' && pendingDesiredState === null && (time - lastWanderAt) > 3500) {
                targetX = baseTarget.x + (Math.random() - 0.5) * 60;
                targetY = baseTarget.y + (Math.random() - 0.5) * 40;
                star.setVisible(true);
                star.anims.play('star_idle', true);
                isMoving = true;
                lastWanderAt = time;
            }
            */
        }

        function showBubble() {
            if (bubble) { bubble.destroy(); bubble = null; }
            const texts = BUBBLE_TEXTS[currentState] || BUBBLE_TEXTS.idle;
            if (currentState === 'idle') return; // no bubble while sitting on sofa

            // Bubble anchor should follow current visible character:
            // - syncing: syncAnimSprite
            // - error state: errorBug
            // - working at desk: starWorking
            // - other: star
            let anchorX = star.x;
            let anchorY = star.y;
            if (currentState === 'syncing' && syncAnimSprite && syncAnimSprite.visible) {
                anchorX = syncAnimSprite.x;
                anchorY = syncAnimSprite.y;
            } else if (currentState === 'error' && window.errorBug && window.errorBug.visible) {
                anchorX = window.errorBug.x;
                anchorY = window.errorBug.y;
            } else if (!star.visible && window.starWorking && window.starWorking.visible) {
                anchorX = window.starWorking.x;
                anchorY = window.starWorking.y;
            }

            const text = texts[Math.floor(Math.random() * texts.length)];
            const bubbleY = anchorY - 70;

            // 只做手机端稍微调大一点，避免发糊
            const isTouch = IS_TOUCH_DEVICE;
            const fontSize = isTouch ? 14 : 12;
            const bg = game.add.rectangle(anchorX, bubbleY, text.length * 10 + 20, 28, 0xffffff, 0.95);
            bg.setStrokeStyle(2, 0x000000);
            const txt = game.add.text(anchorX, bubbleY, text, { fontFamily: 'ArkPixel, monospace', fontSize: fontSize + 'px', fill: '#000', align: 'center' }).setOrigin(0.5);
            bubble = game.add.container(0, 0, [bg, txt]);
            bubble.setDepth(1200); // always above desk/star
            setTimeout(() => { if (bubble) { bubble.destroy(); bubble = null; } }, 3000);
        }

        function showCatBubble() {
            if (!window.catSprite) return;
            if (window.catBubble) { window.catBubble.destroy(); window.catBubble = null; }
            const texts = BUBBLE_TEXTS.cat || ['야옹~', '골골...'];
            const text = texts[Math.floor(Math.random() * texts.length)];
            const anchorX = window.catSprite.x;
            const anchorY = window.catSprite.y - 60;
            const bg = game.add.rectangle(anchorX, anchorY, text.length * 10 + 20, 24, 0xfffbeb, 0.95);
            bg.setStrokeStyle(2, 0xd4a574);
            const txt = game.add.text(anchorX, anchorY, text, { fontFamily: 'ArkPixel, monospace', fontSize: '11px', fill: '#8b6914', align: 'center' }).setOrigin(0.5);
            window.catBubble = game.add.container(0, 0, [bg, txt]);
            window.catBubble.setDepth(2100); // top layer above cat
            setTimeout(() => { if (window.catBubble) { window.catBubble.destroy(); window.catBubble = null; } }, 4000);
        }

        // 假 Agent 气泡逻辑已移除，统一以真实 /agents 数据为准

        // 启动游戏
        initGame();
    </script>
</body>
